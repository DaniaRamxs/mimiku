<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src http: https: data:; connect-src 'self' ws:; font-src data:">
<title>Mimiku Overlay 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:transparent}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
#stage{position:fixed;inset:0;pointer-events:none}

/* ── Avatares flotantes (!estado) ── */
.fa{position:absolute;left:0;top:0;display:flex;align-items:center;gap:10px;will-change:transform;
  --fa-size:84px;--fa-c:#a996ff;--fa-bg:rgba(14,11,26,.92);--fa-text:#f5f3ff;--fa-muted:#b9b0e6}
.fa.theme-pastel{--fa-bg:rgba(255,248,242,.95);--fa-text:#5b3a48;--fa-muted:#a07a88}
.fa-inner{display:flex;align-items:center;gap:10px;animation:faIn .6s cubic-bezier(.3,1.6,.5,1) both}
.fa.out .fa-inner{animation:faOut .45s ease-in forwards}
@keyframes faIn{0%{opacity:0;transform:scale(.2) rotate(-25deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes faOut{to{opacity:0;transform:scale(.3) rotate(20deg)}}
.fa-pic{position:relative;flex:none;width:var(--fa-size);height:var(--fa-size);border-radius:50%;
  background:var(--fa-c);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;
  font-size:calc(var(--fa-size) * .42);box-shadow:0 0 0 4px var(--fa-c),0 0 22px var(--fa-c),0 10px 26px rgba(0,0,0,.45);
  transition:box-shadow .35s,background .35s}
.fa-pic img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.fa-ring{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);transform:rotate(-90deg);overflow:visible}
.fa-ring circle{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.85}
.fa-bubble{position:relative;max-width:280px;padding:9px 14px 10px;border-radius:16px;background:var(--fa-bg);
  border:2px solid var(--fa-c);box-shadow:0 0 16px var(--fa-c),0 10px 24px rgba(0,0,0,.4);transition:border-color .35s,box-shadow .35s}
.fa-bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--fa-c);transition:border-color .35s}
.fa-name{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--fa-c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .35s}
.fa-status{font-size:19px;font-weight:800;line-height:1.2;color:var(--fa-text);overflow-wrap:anywhere}
.fa.bump .fa-pic{animation:faBump .35s ease-out}
@keyframes faBump{40%{transform:scale(1.12)}}
.fa.renew .fa-bubble{animation:faRenew .6s ease-out}
@keyframes faRenew{30%{transform:scale(1.08)}}
.fa-corner{position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:18px;font-weight:900;letter-spacing:.2em;color:#fff;
  text-shadow:0 0 10px var(--fa-c),0 0 24px var(--fa-c);white-space:nowrap;animation:faCorner 1.6s ease-out forwards}
@keyframes faCorner{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-30px) scale(1)}}
</style>
</head>
<body>
<div id="stage"></div>
<script>
function finiteNumber(value, fallback, min, max) {
  var parsed = Number(value);
  return Number.isFinite(parsed) ? Math.min(max, Math.max(min, parsed)) : fallback;
}

// ── Avatares flotantes (!estado) ──────────────────────────────────────────────
// Rebote tipo logo de DVD: velocidad constante, cambia de color en cada choque
// con un borde y celebra si entra justo en una esquina.
var FA_COLORS = ["#a996ff", "#22d3ee", "#f472b6", "#a3e635", "#fbbf24", "#fb7185", "#34d399", "#60a5fa"];
var FA_CORNER_SLACK_PX = 6;
var faCfg = { enabled: true, duration_s: 45, max_on_screen: 8, size: 84, speed: 140, collisions: true, theme: "noche" };
var faItems = [], faLast = 0, faRunning = false;

function setFloatAvatarsConfig(m) {
  faCfg = {
    enabled: m.enabled !== false,
    duration_s: finiteNumber(m.duration_s, 45, 5, 600),
    max_on_screen: finiteNumber(m.max_on_screen, 8, 1, 30),
    size: finiteNumber(m.size, 84, 40, 200),
    speed: finiteNumber(m.speed, 140, 20, 600),
    collisions: m.collisions !== false,
    theme: m.theme === "pastel" ? "pastel" : "noche",
  };
  faItems.forEach(function(item) {
    item.el.style.setProperty("--fa-size", faCfg.size + "px");
    item.el.className = "fa theme-" + faCfg.theme;
    var norm = Math.hypot(item.vx, item.vy) || 1;
    item.vx = item.vx / norm * faCfg.speed; item.vy = item.vy / norm * faCfg.speed;
  });
  if (!faCfg.enabled) faItems.slice().forEach(faRemove);
}

function faColorFor(item) { return FA_COLORS[item.colorIndex % FA_COLORS.length]; }

function faBuild(m) {
  var el = document.createElement("div");
  el.className = "fa theme-" + faCfg.theme;
  el.style.setProperty("--fa-size", faCfg.size + "px");
  el.innerHTML = '<div class="fa-inner"><div class="fa-pic"><svg class="fa-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" pathLength="100"></circle></svg></div>' +
    '<div class="fa-bubble"><div class="fa-name"></div><div class="fa-status"></div></div></div>';
  return el;
}

function faFill(item, m) {
  item.el.querySelector(".fa-name").textContent = String(m.name || "?").slice(0, 30);
  item.el.querySelector(".fa-status").textContent = String(m.status || "").slice(0, 80);
  var pic = item.el.querySelector(".fa-pic");
  var url = /^https:\/\//.test(m.avatar || "") ? m.avatar : "";
  var img = pic.querySelector("img");
  if (url) {
    if (!img) { img = document.createElement("img"); pic.insertBefore(img, pic.firstChild); }
    img.src = url;
    var letter = pic.querySelector(".fa-letter"); if (letter) letter.remove();
  } else if (!pic.querySelector(".fa-letter")) {
    var span = document.createElement("span");
    span.className = "fa-letter";
    span.textContent = String(m.name || "?").charAt(0).toUpperCase();
    pic.insertBefore(span, pic.firstChild);
  }
}

function faApplyColor(item) {
  item.el.style.setProperty("--fa-c", faColorFor(item));
}

function showFloatAvatar(m) {
  if (!faCfg.enabled || !m.key) return;
  var key = String(m.key);
  var existing = faItems.filter(function(item) { return item.key === key; })[0];
  var now = performance.now();
  if (existing) {
    // El mismo viewer cambia de estado: sigue flotando donde estaba.
    faFill(existing, m);
    existing.expiresAt = now + faCfg.duration_s * 1000;
    existing.bornAt = now;
    existing.el.classList.remove("renew"); void existing.el.offsetWidth; existing.el.classList.add("renew");
    return;
  }
  var el = faBuild(m);
  var item = { key: key, el: el, x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0, bornAt: now, expiresAt: now + faCfg.duration_s * 1000, leaving: false,
    colorIndex: Math.floor(Math.random() * FA_COLORS.length) };
  faFill(item, m);
  // Empieza con el color de su nombre en Twitch; al primer choque entra en la rueda de colores.
  if (/^#[0-9a-fA-F]{6}$/.test(m.color || "")) item.el.style.setProperty("--fa-c", m.color); else faApplyColor(item);
  document.getElementById("stage").appendChild(el);
  item.w = el.offsetWidth; item.h = el.offsetHeight;
  item.x = Math.random() * Math.max(1, innerWidth - item.w);
  item.y = Math.random() * Math.max(1, innerHeight - item.h);
  var angle = (Math.PI / 6) + Math.random() * (Math.PI / 6) + Math.floor(Math.random() * 4) * (Math.PI / 2);
  item.vx = Math.cos(angle) * faCfg.speed; item.vy = Math.sin(angle) * faCfg.speed;
  faItems.push(item);
  while (faItems.filter(function(i) { return !i.leaving; }).length > faCfg.max_on_screen) {
    faRemove(faItems.filter(function(i) { return !i.leaving; })[0]);
  }
  faPlace(item);
  if (!faRunning) { faRunning = true; faLast = now; requestAnimationFrame(faStep); }
}

function faRemove(item) {
  if (!item || item.leaving) return;
  item.leaving = true;
  item.el.classList.add("out");
  setTimeout(function() {
    item.el.remove();
    faItems = faItems.filter(function(i) { return i !== item; });
  }, 460);
}

function removeFloatAvatar(m) {
  var key = String(m.key || "");
  faItems.filter(function(item) { return item.key === key; }).forEach(faRemove);
}

function faPlace(item) {
  item.el.style.transform = "translate3d(" + item.x.toFixed(1) + "px," + item.y.toFixed(1) + "px,0)";
}

function faBounce(item) {
  item.colorIndex++;
  faApplyColor(item);
  item.el.classList.remove("bump"); void item.el.offsetWidth; item.el.classList.add("bump");
}

function faCorner(item) {
  var tag = document.createElement("div");
  tag.className = "fa-corner";
  tag.textContent = "ESQUINA";
  item.el.appendChild(tag);
  setTimeout(function() { tag.remove(); }, 1600);
}

// Choque entre dos avatares (cajas): se separan por el eje de menor solape y
// se intercambian la velocidad en ese eje, como dos bolas iguales.
function faCollide(a, b) {
  var overlapX = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
  var overlapY = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
  if (overlapX <= 0 || overlapY <= 0) return;
  if (overlapX < overlapY) {
    var dirX = a.x < b.x ? -1 : 1;
    a.x += dirX * overlapX / 2; b.x -= dirX * overlapX / 2;
    var tvx = a.vx; a.vx = b.vx; b.vx = tvx;
    if (Math.sign(a.vx) !== dirX) a.vx = -a.vx;
    if (Math.sign(b.vx) !== -dirX) b.vx = -b.vx;
  } else {
    var dirY = a.y < b.y ? -1 : 1;
    a.y += dirY * overlapY / 2; b.y -= dirY * overlapY / 2;
    var tvy = a.vy; a.vy = b.vy; b.vy = tvy;
    if (Math.sign(a.vy) !== dirY) a.vy = -a.vy;
    if (Math.sign(b.vy) !== -dirY) b.vy = -b.vy;
  }
  faBounce(a); faBounce(b);
}

function faStep(now) {
  var dt = Math.min(0.05, (now - faLast) / 1000);
  faLast = now;
  var maxX = innerWidth, maxY = innerHeight;
  faItems.forEach(function(item) {
    if (item.leaving) return;
    item.w = item.el.offsetWidth; item.h = item.el.offsetHeight;
    item.x += item.vx * dt; item.y += item.vy * dt;
    var hitX = false, hitY = false;
    if (item.x <= 0) { item.x = 0; item.vx = Math.abs(item.vx); hitX = true; }
    else if (item.x + item.w >= maxX) { item.x = Math.max(0, maxX - item.w); item.vx = -Math.abs(item.vx); hitX = true; }
    if (item.y <= 0) { item.y = 0; item.vy = Math.abs(item.vy); hitY = true; }
    else if (item.y + item.h >= maxY) { item.y = Math.max(0, maxY - item.h); item.vy = -Math.abs(item.vy); hitY = true; }
    if (hitX || hitY) {
      faBounce(item);
      // Esquina: los dos bordes a la vez, o el otro borde a menos de unos pixeles.
      var nearX = item.x <= FA_CORNER_SLACK_PX || item.x + item.w >= maxX - FA_CORNER_SLACK_PX;
      var nearY = item.y <= FA_CORNER_SLACK_PX || item.y + item.h >= maxY - FA_CORNER_SLACK_PX;
      if (nearX && nearY) faCorner(item);
    }
    var ring = item.el.querySelector(".fa-ring circle");
    var left = Math.max(0, (item.expiresAt - now) / (item.expiresAt - item.bornAt));
    ring.style.strokeDasharray = "100";
    ring.style.strokeDashoffset = String(100 - left * 100);
    if (now >= item.expiresAt) faRemove(item);
  });
  if (faCfg.collisions) {
    var live = faItems.filter(function(i) { return !i.leaving; });
    for (var i = 0; i < live.length; i++) for (var j = i + 1; j < live.length; j++) faCollide(live[i], live[j]);
  }
  faItems.forEach(faPlace);
  if (faItems.length) requestAnimationFrame(faStep); else faRunning = false;
}

// ── Conexion con Mimiku ───────────────────────────────────────────────────────
var ws = null, reconnectTimer = null, reconnectDelay = 1000, overlayClosing = false;

function handleOverlayMessage(e) {
  var m;
  try { m = JSON.parse(e.data); } catch (_) { return; }
  if (m.type === "float_avatar")         showFloatAvatar(m);
  if (m.type === "float_avatar_remove")  removeFloatAvatar(m);
  if (m.type === "float_avatars_config") setFloatAvatarsConfig(m);
}

function overlaySocketUrl() {
  try {
    if (typeof location !== "undefined" && /^https?:$/.test(location.protocol) && location.host) {
      return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
    }
  } catch (_) {}
  return "ws://127.0.0.1:7778";
}

function scheduleOverlayReconnect() {
  if (overlayClosing || reconnectTimer !== null) return;
  reconnectTimer = setTimeout(function() { reconnectTimer = null; connectOverlay(); }, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 2, 10000);
}

function disconnectOverlaySocket(socket) {
  if (ws !== socket) return;
  ws = null;
  socket.onopen = socket.onmessage = socket.onclose = socket.onerror = null;
  if (socket.readyState < WebSocket.CLOSING) socket.close();
  scheduleOverlayReconnect();
}

function connectOverlay() {
  if (overlayClosing || ws) return;
  var socket;
  try { socket = new WebSocket(overlaySocketUrl()); } catch (_) { scheduleOverlayReconnect(); return; }
  ws = socket;
  socket.onopen = function() { if (ws === socket) reconnectDelay = 1000; };
  socket.onmessage = handleOverlayMessage;
  socket.onclose = socket.onerror = function() { disconnectOverlaySocket(socket); };
}

window.addEventListener("beforeunload", function() {
  overlayClosing = true;
  clearTimeout(reconnectTimer);
  if (ws) disconnectOverlaySocket(ws);
});

connectOverlay();
</script>
</body>
</html>
